<style>

ckground:var(--brand);border-radius:50%}.intro>p{font-size:17px;margin-top:24px;max-width:360px;color:var(--muted)}.intro-note{margin-top:45px;border-top:1px solid var(--line);padding-top:23px;max-width:340px}.intro-note p{font-size:13px;color:var(--muted);margin-top:6px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:32px}.form-heading{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:26px}.form-heading p{font-size:13px;color:var(--muted);margin-top:5px}label,.field-title{display:block;font-weight:600;margin-bottom:8px}.field{margin-bottom:25px}input,select,textarea{width:100%;border:1px solid #cfd5e0;border-radius:9px;background:white;color:var(--ink);padding:12px 14px;min-height:48px}input::placeholder,textarea::placeholder{color:#8490a2}textarea{resize:vertical;min-height:110px}select{padding-right:28px}.required{color:var(--brand)}.help{font-size:12px;color:var(--muted);margin-top:6px}.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:13px}.score{position:relative}.score input{position:absolute;width:1px;height:1px;opacity:0;min-height:0}.score span{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg)}.score input:checked+span{background:var(--brand);color:white;border-color:var(--brand)}.score input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}.score label{margin:0;cursor:pointer}.score-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:12px;font-weight:400;margin:0;cursor:pointer;font-size:14px}.choice:has(input:checked){border-color:var(--brand);background:var(--soft)}.choice input{width:17px;height:17px;min-height:0;margin:4px 0 0;accent-color:var(--brand);flex-shrink:0}.full{width:100%}.foot ribution i{display:block;height:100%}.count-note{font-size:12px;color:var(--muted);margin-top:10px}.mobile-only{display:none}
@media(min-width:1500px){.wrap{padding-top:64px}}@media(max-width:960px){.survey-layout{gap:32px;grid-template-columns:.7fr 1.3fr}.panel{padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.branch-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.header{height:72px;padding:0 18px}.mark{font-size:23px}.brand small{font-size:11px;padding-left:10px}.header .btn{font-size:12px;padding:9px 12px;min-height:42px}.wrap{padding:24px 16px 40px}.survey-layout{display:block}.intro{position:static;padding:8px 3px 26px}.intro>p{font-size:15px;max-width:none;margin-top:15px}.intro-note{display:none}.eyebrow{margin-bottom:13px;font-size:13px}.panel{padding:23px 18px;border-radius:14px}.scores{gap:4px;grid-template-columns:repeat(6,1fr)}.score span{height:44px}.score-ends{margin-top:4px}.dash-head{align-items:start;margin-bottom:20px;gap:12px}.dash-head h1{font-size:28px}.dash-head p{font-size:13px}.user-pill{font-size:11px;padding:7px 9px;max-width:120px;overflow-wrap:anywhere}.tabs{gap:20px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:28px}.toolbar{gap:10px}.toolbar .control{min-width:calc(50% - 10px)}.toolbar .search{flex-basis:100%}.toolbar>.btn{flex:1}.table-panel{padding:0}.section-title{padding:19px 16px}.section-title h3{font-size:15px}.review-table thead{display:none}.review-table,.review-table tbody,.review-table tr,.review-table td{display:block;width:100%}.review-table tr{padding:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:7px 12px}.review-table td{border:0;padding:0;min-width:0}.review-table td:before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}.review-table td.comment{grid-column:1/-1;max-width:none;margin-top:5px}.review-table td.channel{grid-column:1/-1;font-size:12px;color:var(--muted)}.branch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.branch-card{padding:13px}.branch-card h3{font-size:14px}.login-shell{margin:12px auto 40px}.pagination{padding:16px;flex-wrap:wrap}.log-table th,.log-table td{padding:12px 14px}.desktop-only{display:none}.mobile-only{display:block}}
@media(prefers-reduced-motion:no-preference){.btn,.score span{transition:background .15s,border-color .15s}.panel{animation:appear .25s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
.branch-open{display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.branch-open:hover{border-color:var(--brand);background:var(--soft)}.branch-open strong{display:block;font-size:17px}.branch-open small{display:block;color:var(--brand);margin-top:12px}.store-link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;min-height:30px;text-align:left}.log-pagination{flex-wrap:wrap}.log-pagination .btn{min-width:40px;min-height:40px}.log-pages{display:flex;gap:5px;flex-wrap:wrap}.log-pages [aria-current="page"]{background:var(--brand);color:#fff;border-color:var(--brand)}.log-size{display:flex;align-items:center;gap:8px;font-size:12px;margin:0;font-weight:400}.log-size select{width:auto;min-height:40px;padding:6px 24px 6px 10px}.log-dialog{width:min(1020px,calc(100% - 32px));max-width:none;max-height:86vh;border:1px solid var(--line);border-radius:18px;padding:0;color:var(--ink);background:#fff;box-shadow:0 20px 80px #242b3b40}.log-dialog::backdrop{background:#18213599}.dialog-header{display:flex;justify-content:space-between;align-items:start;gap:18px;padding:23px 26px;border-bottom:1px solid var(--line)}.dialog-header p{margin-top:7px;font-size:13px;color:var(--muted)}.dialog-content{overflow:auto}.dialog-content .table-panel{border:0;border-radius:0}.dialog-header .btn{flex-shrink:0}.log-error{padding:20px}.log-error p{margin-bottom:14px;color:#923a2a;overflow-wrap:anywhere}@media(max-width:700px){.log-dialog{width:calc(100% - 20px);max-height:90vh;border-radius:14px}.dialog-header{padding:18px 16px}.dialog-header h2{font-size:21px}.dialog-header .btn{padding:8px 12px}.log-pages{width:100%}.branch-open strong{font-size:14px}.branch-open small{font-size:11px}}

</style></head><body>
<div id="demoBanner" class="demo-banner hidden">Tasarım önizlemesi • Örnek veriler gösteriliyor, Sheets’e kayıt yapılmaz.</div>
<header class="header"><a class="brand" href="#" id="brandLink"><span class="mark">hedef<span style="font-weight:400">avm</span></span><small>Mağaza ve yönetim<br>Değerlendirme paneli</small></a><button class="btn secondary hidden" id="headerAction">Çıkış yap</button></header>
<main class="wrap" id="app"></main><footer class="footer">Hedef Alışveriş Merkezleri · Yönetici ve mağaza paneli.</footer>
<script>

'use strict';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwh_n0IEUH1B3Wd_d9kPu9aFz2zGzLWZU7FcSf5rn53DcYtLTqonCnF-MBdjTDVkVpu/exec';
const STORES=['Kavacık','Paşabahçe','Çekmeköy','Yenidoğan','Sultanbeyli','Çayırova','Gebze','Körfez','Derince','İzmit','Gölcük','İnegöl','Düzce'];
const CHANNELS=['Mağazanızı yoldan geçerken fark ettim','Bir tanıdığımın önerisiyle geldim','hedefavm.com veya sosyal medya sayesinde','Daha önce de alışveriş yapmıştım, memnun kaldığım için tekrar geldim'];
const demo=new URLSearchParams(location.search).has('demo');let loginRole='store',loginStore='';let token='',user=null,data=null,tab='reviews',page=1,query='',storeFilter='',monthFilter='',scoreFilter='',busy=false;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Intl.DateTimeFormat('tr-TR',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Istanbul'}).format(new Date(s));
async function rpc(fn,...args){
 if(demo)return demoRpc(fn,...args);
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);
 try{
  const response=await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args}),signal:controller.signal});
  if(!response.ok)throw Error('Sunucuya ulaşılamadı (HTTP '+response.status+'). Apps Script erişimini kontrol edin.');
  let payload;try{payload=await response.json();}catch{throw Error('Sunucu JSON yanıtı vermedi. Güncel Code.gs dosyasını yeni sürüm olarak dağıtın; erişimi Herkes yapın.');}
  if(!payload||typeof payload.ok!=='boolean')throw Error('API yanıtı geçersiz. Güncel Code.gs sürümünü dağıtın.');
  if(!payload.ok)throw Error(payload.error||'İşlem tamamlanamadı.');
  return payload.data;
 }catch(error){
  if(error.name==='AbortError')throw Error('Sunucu yanıtı zaman aşımına uğradı. Gönderim yapılmış olabilir; tekrar denerseniz aynı kayıt kimliği kullanılır.');
  if(error instanceof TypeError)throw Error('Backend bağlantısı kurulamadı. İnternet bağlantısını ve Apps Script dağıtımının Herkes erişimine açık olduğunu kontrol edin.');
  throw error;
 }finally{clearTimeout(timeout);}
}
function message(text){const el=document.getElementById('status');if(el){el.textContent=text;el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function buttonBusy(form,on){form.querySelectorAll('button[type="submit"]').forEach(b=>{b.disabled=on;b.textContent=on?'İşleniyor…':b.dataset.label;});}
function options(values,selected=''){return values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function header(){const action=document.getElementById('headerAction');action.textContent='Çıkış yap';action.classList.toggle('hidden',!user);}
function loginView(){
 const isAdmin=loginRole==='admin';
 app.innerHTML=`<section class="panel login-shell"><div class="login-switch" role="tablist" aria-label="Giriş türü"><button type="button" role="tab" id="storeLoginTab" data-login-role="store" aria-selected="${!isAdmin}" aria-controls="loginForm" class="${!isAdmin?'selected':''}">Mağaza paneli</button><button type="button" role="tab" id="adminLoginTab" data-login-role="admin" aria-selected="${isAdmin}" aria-controls="loginForm" class="${isAdmin?'selected':''}">Yönetici paneli</button></div><h1>${isAdmin?'Yönetici paneline giriş':'Mağaza paneline giriş'}</h1><p class="muted">${isAdmin?'Tüm mağazaların değerlendirmelerini ve giriş geçmişini yönetin.':'Listeden mağazanızı seçin ve mağaza şifrenizle giriş yapın.'}</p><form id="loginForm" aria-labelledby="${isAdmin?'adminLoginTab':'storeLoginTab'}">${isAdmin?'<div class="field"><label for="username">Yönetici kullanıcı adı</label><input id="username" autocomplete="username" required maxlength="60" value="admin"></div>':`<div class="field"><label for="loginStore">Mağazanız</label><select id="loginStore" required><option value="">Mağazanızı seçin</option>${options(STORES,loginStore)}</select></div>`}<div class="field"><label for="password">${isAdmin?'Yönetici şifresi':'Mağaza şifresi'}</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required maxlength="200"><button class="peek" type="button" id="peek" aria-label="Şifreyi göster">Göster</button></div></div><div id="status" class="status" role="alert"></div><button class="btn full" type="submit" data-label="Giriş yap">Giriş yap</button></form><p class="help" style="margin:20px 0 0">${isAdmin?'Yalnızca yetkili yönetici hesapları giriş yapabilir.':'Mağaza şifrelerini yalnızca merkez yönetim güncelleyebilir.'}</p>${demo?'<div class="status" style="background:#fff8e9;color:#70551d">Önizleme modu: şifre alanına herhangi bir değer yazabilirsiniz.</div>':''}</section>`;
 document.querySelectorAll('[data-login-role]').forEach(b=>b.onclick=()=>{loginRole=b.dataset.loginRole;loginView();document.querySelector('[data-login-role="'+loginRole+'"]').focus();});
 if(!isAdmin)document.getElementById('loginStore').onchange=e=>{loginStore=e.target.value;};
 document.getElementById('peek').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('peek').textContent=p.type==='password'?'Göster':'Gizle';};
 document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const f=e.target,role=loginRole,store=role==='store'?document.getElementById('loginStore').value:'';
  buttonBusy(f,true);document.querySelectorAll('[data-login-role]').forEach(b=>b.disabled=true);
  try{
   const res=await rpc('login',{portalRole:role,store,username:role==='admin'?document.getElementById('username').value:'',password:document.getElementById('password').value});
   if(res.user.role!==role||(role==='store'&&res.user.store!==store)){try{await rpc('logout',res.token);}catch{}throw Error('Seçilen panel veya mağaza hesapla eşleşmiyor. Giriş bilgilerini kontrol edin.');}
   token=res.token;user=res.user;tab='reviews';storeFilter='';monthFilter='';query='';scoreFilter='';page=1;header();await loadDashboard();
  }catch(err){if(f.isConnected){message(err.message);buttonBusy(f,false);document.querySelectorAll('[data-login-role]').forEach(b=>b.disabled=false);}}
 };
}
async function loadDashboard(){app.innerHTML='<div class="spinner" role="status">Değerlendirmeler yükleniyor…</div>';try{data=await rpc('getDashboard',token,{month:monthFilter,store:storeFilter});user=data.user;monthFilter=data.month;dashboard();}catch(err){app.innerHTML=`<section class="panel"><h2>Panel yüklenemedi</h2><p style="margin:15px 0" role="alert">${esc(err.message)}</p><button class="btn" id="retry">Tekrar dene</button> <button class="btn secondary" id="relogin">Giriş ekranı</button></section>`;document.getElementById('retry').onclick=loadDashboard;document.getElementById('relogin').onclick=()=>{user=null;token='';header();loginView();};}}
function rating(n){return `<span class="rating ${n<7?'low':n<9?'mid':''}">${n}<span style="font-weight:400;opacity:.65"> / 10</span></span>`;}
function dashboard(){const admin=user.role==='admin';app.innerHTML=`<div class="dash-head"><div><h1>${admin?'Deneyime genel bakış':esc(user.store)+' mağazası'}</h1><p class="muted">${admin?'Müşterilerin sesini dinleyin, mağazalarınızın nabzını tutun.':'Müşteri değerlendirmelerinizi buradan takip edebilirsiniz.'}</p></div><div class="user-pill">${admin?'Merkez yönetim':'Mağaza paneli'}<br><b>${esc(user.id)}</b></div></div><nav class="tabs" aria-label="Panel bölümleri"><button class="tab ${tab==='reviews'?'active':''}" data-tab="reviews">Değerlendirmeler</button>${admin?`<button class="tab ${tab==='logs'?'active':''}" data-tab="logs">Mağaza girişleri</button><button class="tab ${tab==='passwords'?'active':''}" data-tab="passwords">Mağaza şifreleri</button>`:''}${admin?`<button class="tab ${tab==='account'?'active':''}" data-tab="account">Hesap güvenliği</button>`:''}</nav><div id="dashContent"></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;dashboard();});if(tab==='account'&&admin)account();else if(tab==='passwords'&&admin)storePasswords();else if(tab==='logs'&&admin)logs();else reviews();}
function reviews(){const admin=user.role==='admin',r=data.reviews,total=r.length,avg=total?(r.reduce((s,x)=>s+x.score,0)/total).toFixed(1):'—',prom=r.filter(x=>x.score>=9).length,low=r.filter(x=>x.score<=6).length,nps=total?Math.round((prom-low)/total*100):'—';document.getElementById('dashContent').innerHTML=`<div class="stats"><article class="stat accent"><span>Değerlendirme sayısı</span><strong>${total}</strong><small>${esc(data.month)}${admin&&storeFilter?' · '+esc(storeFilter):''}</small></article><article class="stat"><span>Ortalama puan</span><strong>${avg}<small> / 10</small></strong><small>Seçili dönemde</small></article><article class="stat"><span>Tavsiye edenler</span><strong>${total?Math.round(prom/total*100):'—'}<small> ${total?'%':''}</small></strong><small>9 ve 10 puan verenler</small></article><article class="stat"><span>Net tavsiye skoru</span><strong>${nps}</strong><small title="9–10 verenlerin yüzdesi eksi 0–6 verenlerin yüzdesi">NPS · −100 ile +100 arası</small></article></div><div class="toolbar"><div class="control"><label for="monthFilter">Dönem</label><select id="monthFilter">${options(data.months,monthFilter)}</select></div>${admin?`<div class="control"><label for="storeFilter">Mağaza</label><select id="storeFilter"><option value="">Tüm mağazalar</option>${options(STORES,storeFilter)}</select></div>`:''}<div class="control"><label for="scoreFilter">Puan</label><select id="scoreFilter"><option value="">Tüm puanlar</option><option value="low" ${scoreFilter==='low'?'selected':''}>0–6 puan</option><option value="mid" ${scoreFilter==='mid'?'selected':''}>7–8 puan</option><option value="high" ${scoreFilter==='high'?'selected':''}>9–10 puan</option></select></div><div class="control search"><label for="search">İsim soyisim ara</label><input id="search" type="search" placeholder="Müşteri adı…" value="${esc(query)}"></div><button class="btn secondary" id="refresh">Yenile</button><button class="btn secondary" id="export">CSV indir</button></div><section class="panel table-panel"><div class="section-title"><h3>Müşteri değerlendirmeleri</h3><span class="badge">${admin?'Yönetici görünümü':'Size özel kayıtlar'}</span></div><div id="reviewRows"></div></section><p class="count-note">${admin?'Yorumlar ve ulaşım kanalları yalnızca yönetici hesabında görünür.':'Bu panel yalnızca değerlendirme tarihi, isim soyisim ve puan bilgilerini gösterir.'} Özetler dönem ve mağaza seçimine göredir; arama ve puan filtresi listeyi daraltır.</p>`;document.getElementById('monthFilter').onchange=e=>{monthFilter=e.target.value;page=1;loadDashboard();};if(admin)document.getElementById('storeFilter').onchange=e=>{storeFilter=e.target.value;page=1;loadDashboard();};document.getElementById('scoreFilter').onchange=e=>{scoreFilter=e.target.value;page=1;renderRows();};document.getElementById('search').oninput=e=>{query=e.target.value;page=1;renderRows();};document.getElementById('refresh').onclick=loadDashboard;document.getElementById('export').onclick=exportCsv;renderRows();}
function filtered(){return data.reviews.filter(r=>r.name.toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr'))&&(!scoreFilter||(scoreFilter==='low'?r.score<=6:scoreFilter==='mid'?r.score>=7&&r.score<=8:r.score>=9)));}
function renderRows(){const admin=user.role==='admin',all=filtered(),pages=Math.max(1,Math.ceil(all.length/20));page=Math.min(page,pages);const rows=all.slice((page-1)*20,page*20);document.getElementById('reviewRows').innerHTML=rows.length?`<div class="table-scroll"><table class="review-table"><thead><tr><th>Değerlendirme tarihi</th><th>İsim soyisim</th>${admin?'<th>Mağaza</th>':''}<th>Puan</th>${admin?'<th>Yorum</th><th>Ulaşım kanalı</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td class="date" data-label="Değerlendirme tarihi">${date(r.date)}</td><td data-label="İsim soyisim"><b>${esc(r.name)}</b></td>${admin?`<td data-label="Mağaza">${esc(r.store)}</td>`:''}<td data-label="Puan">${rating(r.score)}</td>${admin?`<td class="comment" data-label="Yorum">${esc(r.comment||'Yorum bırakılmadı.')}</td><td class="channel" data-label="Ulaşım kanalı">${esc(r.channel)}</td>`:''}</tr>`).join('')}</tbody></table></div><div class="pagination"><span>${all.length} kayıt · Sayfa ${page} / ${pages}</span><div><button class="btn secondary" id="prev" ${page===1?'disabled':''}>Önceki</button> <button class="btn secondary" id="next" ${page===pages?'disabled':''}>Sonraki</button></div></div>`:'<div class="empty">Bu seçim için değerlendirme bulunamadı.<br>Farklı bir dönem seçin veya filtreleri temizleyin.</div>';if(rows.length){document.getElementById('prev').onclick=()=>{page--;renderRows();};document.getElementById('next').onclick=()=>{page++;renderRows();};}}
function logs(){document.getElementById('dashContent').innerHTML=`<div class="dash-head"><div><h2>Mağazalar paneli kontrol ediyor mu?</h2><p class="muted">Mağaza adına basarak o mağazanın geçmişini açabilirsiniz. Giriş kaydı, içeriğin okunduğunu kanıtlamaz.</p></div><button class="btn secondary" id="refreshLogs">Yenile</button></div><div class="branch-grid">${data.branches.map(b=>`<button type="button" class="branch-card branch-open" data-log-store="${esc(b.store)}" aria-haspopup="dialog"><strong>${esc(b.store)}</strong><p>${b.lastLogin?'Son giriş<br><b>'+date(b.lastLogin)+'</b>':'Henüz başarılı giriş yok'}</p><small>Giriş geçmişini görüntüle</small></button>`).join('')}</div><section class="panel table-panel"><div class="section-title"><h3>Giriş / çıkış geçmişi</h3><span class="badge">Tüm geçmiş</span></div><div id="allLoginLogs"></div></section>`;document.getElementById('refreshLogs').onclick=loadDashboard;document.querySelectorAll('.branch-open').forEach(b=>b.onclick=()=>openStoreLogs(b.dataset.logStore));logHistory(document.getElementById('allLoginLogs'));}
function openStoreLogs(store){
 if(user?.role!=='admin'||!STORES.includes(store))return;
 document.getElementById('storeLogDialog')?.close();
 const dialog=document.createElement('dialog');dialog.id='storeLogDialog';dialog.className='log-dialog';dialog.setAttribute('aria-labelledby','storeLogTitle');
 dialog.innerHTML=`<div class="dialog-header"><div><h2 id="storeLogTitle">${esc(store)} mağazası</h2><p>Bu mağazaya ait giriş ve çıkış geçmişi · En yeni kayıtlar önce</p></div><button class="btn secondary" id="closeStoreLogs" type="button" autofocus>Kapat</button></div><div class="dialog-content"><section class="panel table-panel"><div id="storeLoginLogs"></div></section></div>`;
 document.body.appendChild(dialog);dialog.addEventListener('close',()=>dialog.remove(),{once:true});dialog.querySelector('#closeStoreLogs').onclick=()=>dialog.close();
 dialog.onclick=e=>{if(e.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)dialog.close();};
 dialog.showModal();logHistory(dialog.querySelector('#storeLoginLogs'),store);
}
function logHistory(container,store=''){
 let page=1,pageSize=20,request=0;
 async function draw(){
  const current=++request;container.innerHTML='<div class="spinner" role="status">Giriş geçmişi yükleniyor…</div>';
  try{
   const result=await rpc('getLoginLogs',token,{store,page,pageSize});
   if(current!==request||!container.isConnected)return;page=result.page;pageSize=result.pageSize;
   const start=result.total?(page-1)*pageSize+1:0,end=Math.min(page*pageSize,result.total);
   const numbers=[...new Set([1,page-1,page,page+1,result.pages].filter(n=>n>0&&n<=result.pages))].sort((a,b)=>a-b);
   container.innerHTML=(result.logs.length?`<div class="table-scroll"><table class="log-table"><thead><tr><th>Tarih</th><th>Hesap</th>${store?'':'<th>Mağaza</th>'}<th>İşlem</th><th>Sonuç</th></tr></thead><tbody>${result.logs.map(l=>`<tr><td class="date">${date(l.date)}</td><td>${esc(l.username)}</td>${store?'':`<td>${STORES.includes(l.store)?`<button type="button" class="store-link" data-log-store="${esc(l.store)}" aria-haspopup="dialog">${esc(l.store)}</button>`:esc(l.store)}</td>`}<td>${esc(l.event)}</td><td>${esc(l.result)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">'+(store?'Bu mağaza için henüz giriş / çıkış kaydı yok.':'Henüz giriş / çıkış kaydı yok.')+'</div>')+`<div class="pagination log-pagination"><span aria-live="polite">${start}–${end} / ${result.total} kayıt · Sayfa ${page} / ${result.pages}</span><label class="log-size">Sayfada<select aria-label="Sayfa başına giriş kaydı">${[10,20,50].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n}</option>`).join('')}</select>kayıt</label><nav class="log-pages" aria-label="Giriş geçmişi sayfaları"><button class="btn secondary" data-page="${page-1}" ${page===1?'disabled':''}>Önceki</button>${numbers.map((n,i)=>(i&&n-numbers[i-1]>1?'<span aria-hidden="true">…</span>':'')+`<button class="btn secondary" data-page="${n}" aria-label="${n}. sayfa" ${n===page?'aria-current="page"':''}>${n}</button>`).join('')}<button class="btn secondary" data-page="${page+1}" ${page===result.pages?'disabled':''}>Sonraki</button></nav></div>`;
   const dialog=container.closest('dialog');if(dialog)dialog.scrollTop=0;
   container.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);draw();});
   container.querySelector('select').onchange=e=>{pageSize=Number(e.target.value);page=1;draw();};
   container.querySelectorAll('[data-log-store]').forEach(b=>b.onclick=()=>openStoreLogs(b.dataset.logStore));
  }catch(error){if(current===request&&container.isConnected){container.innerHTML='<div class="log-error"><p role="alert"></p><button class="btn secondary" type="button">Tekrar dene</button></div>';container.querySelector('p').textContent=error.message;container.querySelector('button').onclick=draw;}}
 }
 draw();
}
function account(){if(user?.role!=='admin')return;document.getElementById('dashContent').innerHTML=`<section class="panel account"><h2>Şifrenizi değiştirin</h2><p class="muted" style="margin:10px 0 25px">En az 12 karakter kullanın. Şifre değiştiğinde bu hesaba ait tüm oturumlar kapatılır.</p><form id="passwordForm"><div class="field"><label for="current">Mevcut şifre</label><input id="current" type="password" autocomplete="current-password" required maxlength="200"></div><div class="field"><label for="nextPassword">Yeni şifre</label><input id="nextPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><div class="field"><label for="confirm">Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><div id="status" class="status" role="alert"></div><button class="btn" type="submit" data-label="Şifreyi değiştir">Şifreyi değiştir</button></form></section>`;document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const next=document.getElementById('nextPassword').value;if(next!==document.getElementById('confirm').value)return message('Yeni şifreler eşleşmiyor.');buttonBusy(e.target,true);try{await rpc('changePassword',token,{current:document.getElementById('current').value,next});user=null;token='';header();loginView();message('Şifreniz değiştirildi. Yeni şifrenizle giriş yapın.');}catch(err){message(err.message);buttonBusy(e.target,false);}};}
async function storePasswords(){
 const root=document.getElementById('dashContent');root.innerHTML='<div class="spinner" role="status">Mağaza hesapları yükleniyor…</div>';
 try{
  const accounts=await rpc('getStoreAccounts',token);
  if(!user||user.role!=='admin'||tab!=='passwords'||!root.isConnected)return;
  root.innerHTML=`<section class="panel account"><h2>Mağaza şifresini güncelleyin</h2><p class="muted" style="margin:10px 0 25px">Mağazayı seçip yeni bir şifre belirleyin. Eski şifreyi bilmeniz gerekmez; mevcut şifreler görüntülenmez.</p>${accounts.length?`<form id="storePasswordForm"><div class="field"><label for="accountStore">Mağaza</label><select id="accountStore" required>${accounts.map(a=>`<option value="${esc(a.username)}">${esc(a.store)}${a.active?'':' (hesap kapalı)'}</option>`).join('')}</select></div><div class="field"><label for="storeUsername">Kullanıcı adı</label><input id="storeUsername" readonly></div><div class="field"><label for="storeNext">Yeni şifre</label><input id="storeNext" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><p class="help">En az 12 karakter kullanın. Yeni şifreyi ilgili mağazayla paylaşın.</p></div><div class="field"><label for="storeConfirm">Yeni şifre tekrar</label><input id="storeConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><p class="help" style="margin-bottom:16px">Şifre değiştiğinde seçili mağazanın tüm açık oturumları kapatılır. Kapalı hesaplar bu işlemle açılmaz.</p><div id="status" class="status" role="status" aria-live="polite"></div><button class="btn full" type="submit" data-label="Mağaza şifresini güncelle">Mağaza şifresini güncelle</button></form>`:'<div class="empty">Mağaza hesabı yok. Apps Script editöründen setup çalıştırın.</div>'}</section>`;
  if(!accounts.length)return;
  const select=document.getElementById('accountStore');
  select.onchange=()=>{document.getElementById('storeUsername').value=select.value;document.getElementById('storeNext').value='';document.getElementById('storeConfirm').value='';message('');};select.onchange();
  document.getElementById('storePasswordForm').onsubmit=async e=>{
   e.preventDefault();const form=e.target,username=select.value,next=document.getElementById('storeNext').value;
   if(next!==document.getElementById('storeConfirm').value)return message('Yeni şifreler eşleşmiyor.');
   message('');buttonBusy(form,true);select.disabled=true;
   try{const result=await rpc('adminSetStorePassword',token,{username,next});if(!form.isConnected)return;document.getElementById('storeNext').value='';document.getElementById('storeConfirm').value='';message(result.store+' mağazasının şifresi güncellendi. Açık oturumları kapatıldı.');}
   catch(error){if(form.isConnected)message(error.message);}
   finally{if(form.isConnected){buttonBusy(form,false);select.disabled=false;}}
  };
 }catch(error){if(root.isConnected&&tab==='passwords'){root.innerHTML='<section class="panel"><div class="status" role="alert"></div><button class="btn secondary" id="retryAccounts">Tekrar dene</button></section>';root.querySelector('.status').textContent=error.message;document.getElementById('retryAccounts').onclick=storePasswords;}}
}
function exportCsv(){const admin=user.role==='admin';const header=['Değerlendirme tarihi','İsim soyisim',...(admin?['Mağaza']:[]),'Puan',...(admin?['Yorum','Ulaşım kanalı']:[])];const rows=filtered().map(r=>[date(r.date),r.name,...(admin?[r.store]:[]),r.score,...(admin?[r.comment,r.channel]:[])]);const cell=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+[header,...rows].map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Hedef-AVM-'+monthFilter+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('brandLink').onclick=e=>{e.preventDefault();if(user){dashboard();}else loginView();};document.getElementById('headerAction').onclick=async()=>{if(user){try{await rpc('logout',token);}catch(e){/* Local session is always discarded. */}user=null;token='';header();loginView();}else loginView();};
function demoRpc(fn,...args){if(fn==='getLoginLogs'){const filter=args[1]||{},size=[10,20,50].includes(Number(filter.pageSize))?Number(filter.pageSize):20;const logs=Array.from({length:533},(_,i)=>({date:new Date(Date.UTC(2026,10,16-Math.floor(i/13),14-i%8,i%60)).toISOString(),username:'magaza'+String(i%13+1).padStart(2,'0'),store:STORES[i%13],event:i%3===0?'Çıkış':'Giriş',result:i%11===0?'Başarısız':'Başarılı'})).filter(l=>!filter.store||l.store===filter.store);const pages=Math.max(1,Math.ceil(logs.length/size)),page=Math.min(Math.max(1,Number(filter.page)||1),pages);return Promise.resolve({store:filter.store||'',page,pageSize:size,total:logs.length,pages,logs:logs.slice((page-1)*size,page*size)});}if(fn==='getStoreAccounts')return Promise.resolve(STORES.map((store,i)=>({store,username:'magaza'+String(i+1).padStart(2,'0'),active:true})));if(fn==='adminSetStorePassword')return Promise.resolve({username:args[1].username,store:STORES[Number(args[1].username.slice(-2))-1]});if(fn==='login'){const input=args[0],role=input.portalRole;if(role==='admin'&&input.username!=='admin')return Promise.reject(Error('Yönetici kullanıcı adı hatalı.'));const index=STORES.indexOf(input.store);if(role==='store'&&index<0)return Promise.reject(Error('Mağazanızı seçin.'));user={id:role==='admin'?'admin':'magaza'+String(index+1).padStart(2,'0'),role,store:role==='admin'?'Tüm mağazalar':input.store};return Promise.resolve({token:'demo',user});}if(fn==='logout'||fn==='changePassword')return Promise.resolve(true);if(fn==='getDashboard'){const admin=user.role==='admin',month=args[1]?.month||'KASIM 2026',store=args[1]?.store;let rows=Array.from({length:38},(_,i)=>({date:new Date(Date.UTC(2026,month==='EKİM 2026'?9:10,16-i%15,9+i%8,i%60)).toISOString(),name:['Ayşe Yılmaz','Mehmet Demir','Zeynep Kaya','Emre Çelik','Elif Aydın','Can Arslan'][i%6],score:[10,9,8,10,6,9,7,10,4,8][i%10],store:STORES[i%13],comment:['İlgileri için teşekkür ederim, alışverişimden memnun kaldım.','Teslimat süresi hakkında daha net bilgi verilebilir.','','Çalışanlar çok yardımcı oldu.'][i%4],channel:CHANNELS[i%4]})).filter(r=>admin?(!store||r.store===store):r.store===user.store);if(!admin)rows=rows.map(({date,name,score})=>({date,name,score}));return Promise.resolve({user,months:['KASIM 2026','EKİM 2026'],month,reviews:rows,...(admin?{branches:STORES.map((s,i)=>({store:s,lastLogin:i<9?new Date(Date.UTC(2026,10,16-i%4,8+i%8)).toISOString():null})),logs:STORES.slice(0,9).map((s,i)=>({date:new Date(Date.UTC(2026,10,16-i%4,8+i%8)).toISOString(),username:'magaza'+String(i+1).padStart(2,'0'),store:s,event:'Giriş',result:'Başarılı'}))}:{})});}return Promise.reject(Error('Önizlemede desteklenmeyen işlem.'));}
if(demo)document.getElementById('demoBanner').classList.remove('hidden');header();loginView();
