<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#C02D78"><title>Hedef AVM | Deneyim Portalı</title>
<style>

ckground:var(--brand);border-radius:50%}.intro>p{font-size:17px;margin-top:24px;max-width:360px;color:var(--muted)}.intro-note{margin-top:45px;border-top:1px solid var(--line);padding-top:23px;max-width:340px}.intro-note p{font-size:13px;color:var(--muted);margin-top:6px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:32px}.form-heading{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:26px}.form-heading p{font-size:13px;color:var(--muted);margin-top:5px}label,.field-title{display:block;font-weight:600;margin-bottom:8px}.field{margin-bottom:25px}input,select,textarea{width:100%;border:1px solid #cfd5e0;border-radius:9px;background:white;color:var(--ink);padding:12px 14px;min-height:48px}input::placeholder,textarea::placeholder{color:#8490a2}textarea{resize:vertical;min-height:110px}select{padding-right:28px}.required{color:var(--brand)}.help{font-size:12px;color:var(--muted);margin-top:6px}.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:13px}.score{position:relative}.score input{position:absolute;width:1px;height:1px;opacity:0;min-height:0}.score span{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg)}.score input:checked+span{background:var(--brand);color:white;border-color:var(--brand)}.score input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}.score label{margin:0;cursor:pointer}.score-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:12px;font-weight:400;margin:0;cursor:pointer;font-size:14px}.choice:has(input:checked){border-color:var(--brand);background:var(--soft)}.choice input{width:17px;height:17px;min-height:0;margin:4px 0 0;accent-color:var(--brand);flex-shrink:0}.full{width:100%}.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px;border-top:1px solid var(--line)}.hidden{display:none!important}.trap{position:absolute;left:-9999px}.login-shell{max-width:440px;margin:40px auto 80px}.login-icon{background:var(--soft);color:var(--brand);width:56px;height:56px;display:grid;place-items:center;border-radius:15px;font-size:26px;margin-bottom:24px}.login-shell h1{font-size:30px}.login-shell .muted{margin:12px 0 28px}.password-wrap{position:relative}.password-wrap input{padding-right:70px}.peek{position:absolute;right:5px;top:6px;border:0;background:transparent;color:var(--muted);padding:7px;min-height:36px}.status{padding:13px 16px;border-radius:10px;margin:16px 0;background:#fff3f0;color:#923a2a;border:1px solid #f3c9c0}.status:empty{display:none}.demo-banner{background:#fff4d7;color:#74551c;text-align:center;padding:10px;font-size:13px}.dash-head{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:28px}.dash-head p{margin-top:9px}.user-pill{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:10px;font-size:13px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow:auto}.tab{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:12px 0;font-weight:650;white-space:nowrap}.tab.active{border-color:var(--brand);color:var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:32px;letter-spacing:-1px;line-height:1.4;margin-top:5px}.stat small{font-size:12px;color:var(--muted)}.stat.accent{background:var(--brand);border-color:var(--brand);color:#fff}.stat.accent span,.stat.accent small{color:#fff}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:22px}.toolbar .control{min-width:180px;flex:1}.toolbar label{font-size:12px;color:var(--muted)}.toolbar input,.toolbar select{min-height:44px}.table-panel{padding:0;overflow:hidden}.section-title{padding:23px 26px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.badge{background:var(--soft);color:var(--brand);font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th{color:var(--muted);background:#fafbfc;font-size:12px;font-weight:600;white-space:nowrap}th,td{padding:16px 24px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}.rating{display:inline-flex;background:#edf7f1;color:#176e4c;padding:3px 10px;border-radius:6px;font-weight:700;white-space:nowrap}.rating.low{background:#fff0ee;color:#b44233}.rating.mid{background:#fff7e6;color:#886219}.comment{max-width:340px;min-width:190px;white-space:pre-wrap;overflow-wrap:anywhere}.date{white-space:nowrap;color:var(--muted);font-size:12px}.empty{text-align:center;padding:48px 22px;color:var(--muted)}.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.branch-card{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.branch-card p{font-size:12px;color:var(--muted);margin-top:7px}.success{text-align:center;padding:55px 25px}.success-icon{width:70px;height:70px;border-radius:50%;background:#e9f7f0;color:var(--green);display:grid;place-items:center;font-size:32px;margin:0 auto 24px}.success p{margin:14px auto 25px;max-width:350px}.account{max-width:520px}.pagination{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.pagination .btn{min-height:36px;padding:5px 12px}.spinner{padding:60px;text-align:center;color:var(--muted)}.distribution{display:flex;gap:4px;height:7px;margin-top:14px;border-radius:5px;overflow:hidden}.distribution i{display:block;height:100%}.count-note{font-size:12px;color:var(--muted);margin-top:10px}.mobile-only{display:none}
@media(min-width:1500px){.wrap{padding-top:64px}}@media(max-width:960px){.survey-layout{gap:32px;grid-template-columns:.7fr 1.3fr}.panel{padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.branch-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.header{height:72px;padding:0 18px}.mark{font-size:23px}.brand small{font-size:11px;padding-left:10px}.header .btn{font-size:12px;padding:9px 12px;min-height:42px}.wrap{padding:24px 16px 40px}.survey-layout{display:block}.intro{position:static;padding:8px 3px 26px}.intro>p{font-size:15px;max-width:none;margin-top:15px}.intro-note{display:none}.eyebrow{margin-bottom:13px;font-size:13px}.panel{padding:23px 18px;border-radius:14px}.scores{gap:4px;grid-template-columns:repeat(6,1fr)}.score span{height:44px}.score-ends{margin-top:4px}.dash-head{align-items:start;margin-bottom:20px;gap:12px}.dash-head h1{font-size:28px}.dash-head p{font-size:13px}.user-pill{font-size:11px;padding:7px 9px;max-width:120px;overflow-wrap:anywhere}.tabs{gap:20px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:28px}.toolbar{gap:10px}.toolbar .control{min-width:calc(50% - 10px)}.toolbar .search{flex-basis:100%}.toolbar>.btn{flex:1}.table-panel{padding:0}.section-title{padding:19px 16px}.section-title h3{font-size:15px}.review-table thead{display:none}.review-table,.review-table tbody,.review-table tr,.review-table td{display:block;width:100%}.review-table tr{padding:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:7px 12px}.review-table td{border:0;padding:0;min-width:0}.review-table td:before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}.review-table td.comment{grid-column:1/-1;max-width:none;margin-top:5px}.review-table td.channel{grid-column:1/-1;font-size:12px;color:var(--muted)}.branch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.branch-card{padding:13px}.branch-card h3{font-size:14px}.login-shell{margin:12px auto 40px}.pagination{padding:16px;flex-wrap:wrap}.log-table th,.log-table td{padding:12px 14px}.desktop-only{display:none}.mobile-only{display:block}}
@media(prefers-reduced-motion:no-preference){.btn,.score span{transition:background .15s,border-color .15s}.panel{animation:appear .25s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body>
<div id="demoBanner" class="demo-banner hidden">Tasarım önizlemesi • Örnek veriler gösteriliyor, Sheets’e kayıt yapılmaz.</div>
<header class="header"><a class="brand" href="#" id="brandLink"><span class="mark">hedef<span style="font-weight:400">avm</span></span><small>Müşteri deneyimi<br>Değerlendirme portalı</small></a><button class="btn secondary" id="headerAction">Panel girişi</button></header>
<main class="wrap" id="app"></main><footer class="footer">Hedef Alışveriş Merkezleri · Görüşlerinizle daha iyiye.</footer>
<script>
'use strict';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwh_n0IEUH1B3Wd_d9kPu9aFz2zGzLWZU7FcSf5rn53DcYtLTqonCnF-MBdjTDVkVpu/exec';
const STORES=['Kavacık','Paşabahçe','Çekmeköy','Yenidoğan','Sultanbeyli','Çayırova','Gebze','Körfez','Derince','İzmit','Gölcük','İnegöl','Düzce'];
const CHANNELS=['Mağazanızı yoldan geçerken fark ettim','Bir tanıdığımın önerisiyle geldim','hedefavm.com veya sosyal medya sayesinde','Daha önce de alışveriş yapmıştım, memnun kaldığım için tekrar geldim'];
const demo=new URLSearchParams(location.search).has('demo');let token='',user=null,data=null,tab='reviews',page=1,query='',storeFilter='',monthFilter='',scoreFilter='',busy=false;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Intl.DateTimeFormat('tr-TR',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Istanbul'}).format(new Date(s));
async function rpc(fn,...args){
 if(demo)return demoRpc(fn,...args);
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);
 try{
  const response=await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args}),signal:controller.signal});
  if(!response.ok)throw Error('Sunucuya ulaşılamadı (HTTP '+response.status+'). Apps Script erişimini kontrol edin.');
  let payload;try{payload=await response.json();}catch{throw Error('Sunucu JSON yanıtı vermedi. Güncel Code.gs dosyasını yeni sürüm olarak dağıtın; erişimi Herkes yapın.');}
  if(!payload||typeof payload.ok!=='boolean')throw Error('API yanıtı geçersiz. Güncel Code.gs sürümünü dağıtın.');
  if(!payload.ok)throw Error(payload.error||'İşlem tamamlanamadı.');
  return payload.data;
 }catch(error){
  if(error.name==='AbortError')throw Error('Sunucu yanıtı zaman aşımına uğradı. Gönderim yapılmış olabilir; tekrar denerseniz aynı kayıt kimliği kullanılır.');
  if(error instanceof TypeError)throw Error('Backend bağlantısı kurulamadı. İnternet bağlantısını ve Apps Script dağıtımının Herkes erişimine açık olduğunu kontrol edin.');
  throw error;
 }finally{clearTimeout(timeout);}
}
function message(text){const el=document.getElementById('status');if(el){el.textContent=text;el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function buttonBusy(form,on){form.querySelectorAll('button[type="submit"]').forEach(b=>{b.disabled=on;b.textContent=on?'İşleniyor…':b.dataset.label;});}
function options(values,selected=''){return values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function header(){document.getElementById('headerAction').textContent=user?'Çıkış yap':'Panel girişi';}
function survey(){user=null;token='';header();const requestId=window.crypto?.randomUUID?.()||'review-'+Date.now()+'-'+Math.random().toString(36).slice(2);app.innerHTML=`<div class="survey-layout"><aside class="intro"><div class="eyebrow"><span class="dot"></span>Her görüş, daha iyi bir deneyim.</div><h1>Alışverişiniz nasıldı?</h1><p>Hedef AVM’deki deneyiminizi merak ediyoruz. Görüşlerinizi bizimle paylaşır mısınız?</p><div class="intro-note"><h3>Sizi dinliyoruz.</h3><p>Değerlendirmeniz hizmetimizi geliştirmemize yardımcı olur. Yorumunuz yalnızca yetkili yönetim ekibine iletilir.</p><p style="margin-top:15px">◷ Yaklaşık 1 dakika</p></div></aside><section class="panel" id="formPanel"><div class="form-heading"><h2>Deneyiminizi paylaşın</h2><p><span class="required">*</span> İşaretli alanlar zorunludur.</p></div><form id="reviewForm"><div class="field"><label for="name">İsim soyisim <span class="required">*</span></label><input id="name" name="name" autocomplete="name" placeholder="Siparişinizdeki isim ve soyisim" minlength="3" maxlength="120" required></div><div class="field"><label for="store">Hizmet aldığınız mağaza <span class="required">*</span></label><select id="store" name="store" required><option value="">Mağazanızı seçin</option>${options(STORES)}</select></div><fieldset class="field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="field-title">Hedef AVM’yi yakınlarınıza ne derece tavsiye edersiniz? <span class="required">*</span></legend><div class="scores">${Array.from({length:11},(_,i)=>`<div class="score"><label><input type="radio" name="score" value="${i}" required aria-label="${i} puan"><span>${i}</span></label></div>`).join('')}</div><div class="score-ends"><span>0 · Kesinlikle tavsiye etmem</span><span>10 · Kesinlikle tavsiye ederim</span></div></fieldset><div class="field"><label for="comment">Bu puanı vermenizin nedeni nedir?</label><textarea id="comment" name="comment" placeholder="Deneyiminizle ilgili paylaşmak istedikleriniz…" maxlength="3000"></textarea><p class="help">İsteğe bağlı · Yorumunuz mağaza panelinde gösterilmez.</p></div><fieldset class="field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="field-title">Bu alışverişinizde markamıza nasıl ulaştınız? <span class="required">*</span></legend><div class="choices">${CHANNELS.map(c=>`<label class="choice"><input type="radio" name="channel" value="${esc(c)}" required><span>${esc(c)}</span></label>`).join('')}</div></fieldset><div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="help" style="margin-bottom:15px">İsim soyisim, tarih ve puanınız ilgili mağazayla; tüm yanıtlarınız yetkili yönetimle paylaşılır.</p><div id="status" class="status" role="alert"></div><button class="btn full" type="submit" data-label="Değerlendirmeyi gönder">Değerlendirmeyi gönder</button></form></section></div>`;document.getElementById('reviewForm').onsubmit=async e=>{e.preventDefault();const f=e.target,values=Object.fromEntries(new FormData(f));values.score=Number(values.score);values.requestId=requestId;buttonBusy(f,true);try{await rpc('submitReview',values);document.getElementById('formPanel').innerHTML=`<div class="success"><div class="success-icon">✓</div><h2>Görüşünüz bize ulaştı.</h2><p class="muted">Zaman ayırdığınız için teşekkür ederiz. Her değerlendirme, daha iyi hizmet sunmamıza yardımcı oluyor.</p><button class="btn secondary" id="again">Yeni değerlendirme</button></div>`;document.getElementById('again').onclick=survey;}catch(err){message(err.message);buttonBusy(f,false);}};}
function loginView(){app.innerHTML=`<section class="panel login-shell"><div class="login-icon" aria-hidden="true">♙</div><h1>Panelinize giriş yapın</h1><p class="muted">Mağazanıza ait değerlendirmeleri takip edin. Yönetici ve mağaza hesapları aynı ekrandan giriş yapar.</p><form id="loginForm"><div class="field"><label for="username">Kullanıcı adı</label><input id="username" autocomplete="username" required maxlength="60" placeholder="Örn. magaza01"></div><div class="field"><label for="password">Şifre</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required maxlength="200"><button class="peek" type="button" id="peek" aria-label="Şifreyi göster">Göster</button></div></div><div id="status" class="status" role="alert"></div><button class="btn full" type="submit" data-label="Giriş yap">Giriş yap</button></form><p class="help" style="margin:20px 0 0">Şifrenizi unuttuysanız merkez yöneticinizle iletişime geçin.</p>${demo?'<div class="status" style="background:#fff8e9;color:#70551d">Önizleme: <b>admin</b> veya <b>magaza01</b> ile giriş yapın. Şifre alanına herhangi bir değer yazın.</div>':''}<button class="btn text full" id="back" style="margin-top:10px">Değerlendirme formuna dön</button></section>`;document.getElementById('back').onclick=survey;document.getElementById('peek').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('peek').textContent=p.type==='password'?'Göster':'Gizle';};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=e.target;buttonBusy(f,true);try{const res=await rpc('login',{username:document.getElementById('username').value,password:document.getElementById('password').value});token=res.token;user=res.user;tab='reviews';storeFilter='';monthFilter='';query='';scoreFilter='';page=1;header();await loadDashboard();}catch(err){message(err.message);buttonBusy(f,false);}};}
async function loadDashboard(){app.innerHTML='<div class="spinner" role="status">Değerlendirmeler yükleniyor…</div>';try{data=await rpc('getDashboard',token,{month:monthFilter,store:storeFilter});user=data.user;monthFilter=data.month;dashboard();}catch(err){app.innerHTML=`<section class="panel"><h2>Panel yüklenemedi</h2><p style="margin:15px 0" role="alert">${esc(err.message)}</p><button class="btn" id="retry">Tekrar dene</button> <button class="btn secondary" id="relogin">Giriş ekranı</button></section>`;document.getElementById('retry').onclick=loadDashboard;document.getElementById('relogin').onclick=()=>{user=null;token='';header();loginView();};}}
function rating(n){return `<span class="rating ${n<7?'low':n<9?'mid':''}">${n}<span style="font-weight:400;opacity:.65"> / 10</span></span>`;}
function dashboard(){const admin=user.role==='admin';app.innerHTML=`<div class="dash-head"><div><h1>${admin?'Deneyime genel bakış':esc(user.store)+' mağazası'}</h1><p class="muted">${admin?'Müşterilerin sesini dinleyin, mağazalarınızın nabzını tutun.':'Müşteri değerlendirmelerinizi buradan takip edebilirsiniz.'}</p></div><div class="user-pill">${admin?'Merkez yönetim':'Mağaza paneli'}<br><b>${esc(user.id)}</b></div></div><nav class="tabs" aria-label="Panel bölümleri"><button class="tab ${tab==='reviews'?'active':''}" data-tab="reviews">Değerlendirmeler</button>${admin?`<button class="tab ${tab==='logs'?'active':''}" data-tab="logs">Mağaza girişleri</button><button class="tab ${tab==='passwords'?'active':''}" data-tab="passwords">Mağaza şifreleri</button>`:''}<button class="tab ${tab==='account'?'active':''}" data-tab="account">Hesap güvenliği</button></nav><div id="dashContent"></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;dashboard();});if(tab==='account')account();else if(tab==='passwords'&&admin)storePasswords();else if(tab==='logs'&&admin)logs();else reviews();}
function reviews(){const admin=user.role==='admin',r=data.reviews,total=r.length,avg=total?(r.reduce((s,x)=>s+x.score,0)/total).toFixed(1):'—',prom=r.filter(x=>x.score>=9).length,low=r.filter(x=>x.score<=6).length,nps=total?Math.round((prom-low)/total*100):'—';document.getElementById('dashContent').innerHTML=`<div class="stats"><article class="stat accent"><span>Değerlendirme sayısı</span><strong>${total}</strong><small>${esc(data.month)}${admin&&storeFilter?' · '+esc(storeFilter):''}</small></article><article class="stat"><span>Ortalama puan</span><strong>${avg}<small> / 10</small></strong><small>Seçili dönemde</small></article><article class="stat"><span>Tavsiye edenler</span><strong>${total?Math.round(prom/total*100):'—'}<small> ${total?'%':''}</small></strong><small>9 ve 10 puan verenler</small></article><article class="stat"><span>Net tavsiye skoru</span><strong>${nps}</strong><small title="9–10 verenlerin yüzdesi eksi 0–6 verenlerin yüzdesi">NPS · −100 ile +100 arası</small></article></div><div class="toolbar"><div class="control"><label for="monthFilter">Dönem</label><select id="monthFilter">${options(data.months,monthFilter)}</select></div>${admin?`<div class="control"><label for="storeFilter">Mağaza</label><select id="storeFilter"><option value="">Tüm mağazalar</option>${options(STORES,storeFilter)}</select></div>`:''}<div class="control"><label for="scoreFilter">Puan</label><select id="scoreFilter"><option value="">Tüm puanlar</option><option value="low" ${scoreFilter==='low'?'selected':''}>0–6 puan</option><option value="mid" ${scoreFilter==='mid'?'selected':''}>7–8 puan</option><option value="high" ${scoreFilter==='high'?'selected':''}>9–10 puan</option></select></div><div class="control search"><label for="search">İsim soyisim ara</label><input id="search" type="search" placeholder="Müşteri adı…" value="${esc(query)}"></div><button class="btn secondary" id="refresh">Yenile</button><button class="btn secondary" id="export">CSV indir</button></div><section class="panel table-panel"><div class="section-title"><h3>Müşteri değerlendirmeleri</h3><span class="badge">${admin?'Yönetici görünümü':'Size özel kayıtlar'}</span></div><div id="reviewRows"></div></section><p class="count-note">${admin?'Yorumlar ve ulaşım kanalları yalnızca yönetici hesabında görünür.':'Bu panel yalnızca değerlendirme tarihi, isim soyisim ve puan bilgilerini gösterir.'} Özetler dönem ve mağaza seçimine göredir; arama ve puan filtresi listeyi daraltır.</p>`;document.getElementById('monthFilter').onchange=e=>{monthFilter=e.target.value;page=1;loadDashboard();};if(admin)document.getElementById('storeFilter').onchange=e=>{storeFilter=e.target.value;page=1;loadDashboard();};document.getElementById('scoreFilter').onchange=e=>{scoreFilter=e.target.value;page=1;renderRows();};document.getElementById('search').oninput=e=>{query=e.target.value;page=1;renderRows();};document.getElementById('refresh').onclick=loadDashboard;document.getElementById('export').onclick=exportCsv;renderRows();}
function filtered(){return data.reviews.filter(r=>r.name.toLocaleLowerCase('tr').includes(query.toLocaleLowerCase('tr'))&&(!scoreFilter||(scoreFilter==='low'?r.score<=6:scoreFilter==='mid'?r.score>=7&&r.score<=8:r.score>=9)));}
function renderRows(){const admin=user.role==='admin',all=filtered(),pages=Math.max(1,Math.ceil(all.length/20));page=Math.min(page,pages);const rows=all.slice((page-1)*20,page*20);document.getElementById('reviewRows').innerHTML=rows.length?`<div class="table-scroll"><table class="review-table"><thead><tr><th>Değerlendirme tarihi</th><th>İsim soyisim</th>${admin?'<th>Mağaza</th>':''}<th>Puan</th>${admin?'<th>Yorum</th><th>Ulaşım kanalı</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td class="date" data-label="Değerlendirme tarihi">${date(r.date)}</td><td data-label="İsim soyisim"><b>${esc(r.name)}</b></td>${admin?`<td data-label="Mağaza">${esc(r.store)}</td>`:''}<td data-label="Puan">${rating(r.score)}</td>${admin?`<td class="comment" data-label="Yorum">${esc(r.comment||'Yorum bırakılmadı.')}</td><td class="channel" data-label="Ulaşım kanalı">${esc(r.channel)}</td>`:''}</tr>`).join('')}</tbody></table></div><div class="pagination"><span>${all.length} kayıt · Sayfa ${page} / ${pages}</span><div><button class="btn secondary" id="prev" ${page===1?'disabled':''}>Önceki</button> <button class="btn secondary" id="next" ${page===pages?'disabled':''}>Sonraki</button></div></div>`:'<div class="empty">Bu seçim için değerlendirme bulunamadı.<br>Farklı bir dönem seçin veya filtreleri temizleyin.</div>';if(rows.length){document.getElementById('prev').onclick=()=>{page--;renderRows();};document.getElementById('next').onclick=()=>{page++;renderRows();};}}
function logs(){document.getElementById('dashContent').innerHTML=`<div class="dash-head"><div><h2>Mağazalar paneli kontrol ediyor mu?</h2><p class="muted">Tüm giriş geçmişindeki en son başarılı girişler. Giriş kaydı, içeriğin okunduğunu kanıtlamaz.</p></div><button class="btn secondary" id="refreshLogs">Yenile</button></div><div class="branch-grid">${data.branches.map(b=>`<article class="branch-card"><h3>${esc(b.store)}</h3><p>${b.lastLogin?'Son giriş<br><b>'+date(b.lastLogin)+'</b>':'Henüz başarılı giriş yok'}</p></article>`).join('')}</div><section class="panel table-panel"><div class="section-title"><h3>Giriş / çıkış geçmişi</h3><span class="badge">Son ${data.logs.length} kayıt</span></div>${data.logs.length?`<div class="table-scroll"><table class="log-table"><thead><tr><th>Tarih</th><th>Hesap</th><th>Mağaza</th><th>İşlem</th><th>Sonuç</th></tr></thead><tbody>${data.logs.map(l=>`<tr><td class="date">${date(l.date)}</td><td>${esc(l.username)}</td><td>${esc(l.store)}</td><td>${esc(l.event)}</td><td>${esc(l.result)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz giriş kaydı yok.</div>'}</section>`;document.getElementById('refreshLogs').onclick=loadDashboard;}
function account(){document.getElementById('dashContent').innerHTML=`<section class="panel account"><h2>Şifrenizi değiştirin</h2><p class="muted" style="margin:10px 0 25px">En az 12 karakter kullanın. Şifre değiştiğinde bu hesaba ait tüm oturumlar kapatılır.</p><form id="passwordForm"><div class="field"><label for="current">Mevcut şifre</label><input id="current" type="password" autocomplete="current-password" required maxlength="200"></div><div class="field"><label for="nextPassword">Yeni şifre</label><input id="nextPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><div class="field"><label for="confirm">Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><div id="status" class="status" role="alert"></div><button class="btn" type="submit" data-label="Şifreyi değiştir">Şifreyi değiştir</button></form></section>`;document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const next=document.getElementById('nextPassword').value;if(next!==document.getElementById('confirm').value)return message('Yeni şifreler eşleşmiyor.');buttonBusy(e.target,true);try{await rpc('changePassword',token,{current:document.getElementById('current').value,next});user=null;token='';header();loginView();message('Şifreniz değiştirildi. Yeni şifrenizle giriş yapın.');}catch(err){message(err.message);buttonBusy(e.target,false);}};}
async function storePasswords(){
 const root=document.getElementById('dashContent');root.innerHTML='<div class="spinner" role="status">Mağaza hesapları yükleniyor…</div>';
 try{
  const accounts=await rpc('getStoreAccounts',token);
  if(!user||user.role!=='admin'||tab!=='passwords'||!root.isConnected)return;
  root.innerHTML=`<section class="panel account"><h2>Mağaza şifresini güncelleyin</h2><p class="muted" style="margin:10px 0 25px">Mağazayı seçip yeni bir şifre belirleyin. Eski şifreyi bilmeniz gerekmez; mevcut şifreler görüntülenmez.</p>${accounts.length?`<form id="storePasswordForm"><div class="field"><label for="accountStore">Mağaza</label><select id="accountStore" required>${accounts.map(a=>`<option value="${esc(a.username)}">${esc(a.store)}${a.active?'':' (hesap kapalı)'}</option>`).join('')}</select></div><div class="field"><label for="storeUsername">Kullanıcı adı</label><input id="storeUsername" readonly></div><div class="field"><label for="storeNext">Yeni şifre</label><input id="storeNext" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><p class="help">En az 12 karakter kullanın. Yeni şifreyi ilgili mağazayla paylaşın.</p></div><div class="field"><label for="storeConfirm">Yeni şifre tekrar</label><input id="storeConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><p class="help" style="margin-bottom:16px">Şifre değiştiğinde seçili mağazanın tüm açık oturumları kapatılır. Kapalı hesaplar bu işlemle açılmaz.</p><div id="status" class="status" role="status" aria-live="polite"></div><button class="btn full" type="submit" data-label="Mağaza şifresini güncelle">Mağaza şifresini güncelle</button></form>`:'<div class="empty">Mağaza hesabı yok. Apps Script editöründen setup çalıştırın.</div>'}</section>`;
  if(!accounts.length)return;
  const select=document.getElementById('accountStore');
  select.onchange=()=>{document.getElementById('storeUsername').value=select.value;document.getElementById('storeNext').value='';document.getElementById('storeConfirm').value='';message('');};select.onchange();
  document.getElementById('storePasswordForm').onsubmit=async e=>{
   e.preventDefault();const form=e.target,username=select.value,next=document.getElementById('storeNext').value;
   if(next!==document.getElementById('storeConfirm').value)return message('Yeni şifreler eşleşmiyor.');
   message('');buttonBusy(form,true);select.disabled=true;
   try{const result=await rpc('adminSetStorePassword',token,{username,next});if(!form.isConnected)return;document.getElementById('storeNext').value='';document.getElementById('storeConfirm').value='';message(result.store+' mağazasının şifresi güncellendi. Açık oturumları kapatıldı.');}
   catch(error){if(form.isConnected)message(error.message);}
   finally{if(form.isConnected){buttonBusy(form,false);select.disabled=false;}}
  };
 }catch(error){if(root.isConnected&&tab==='passwords'){root.innerHTML='<section class="panel"><div class="status" role="alert"></div><button class="btn secondary" id="retryAccounts">Tekrar dene</button></section>';root.querySelector('.status').textContent=error.message;document.getElementById('retryAccounts').onclick=storePasswords;}}
}
function exportCsv(){const admin=user.role==='admin';const header=['Değerlendirme tarihi','İsim soyisim',...(admin?['Mağaza']:[]),'Puan',...(admin?['Yorum','Ulaşım kanalı']:[])];const rows=filtered().map(r=>[date(r.date),r.name,...(admin?[r.store]:[]),r.score,...(admin?[r.comment,r.channel]:[])]);const cell=x=>'"'+String(x??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+[header,...rows].map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Hedef-AVM-'+monthFilter+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('brandLink').onclick=e=>{e.preventDefault();if(user){dashboard();}else survey();};document.getElementById('headerAction').onclick=async()=>{if(user){try{await rpc('logout',token);}catch(e){/* Local session is always discarded. */}user=null;token='';header();loginView();}else loginView();};
function demoRpc(fn,...args){if(fn==='getStoreAccounts')return Promise.resolve(STORES.map((store,i)=>({store,username:'magaza'+String(i+1).padStart(2,'0'),active:true})));if(fn==='adminSetStorePassword')return Promise.resolve({username:args[1].username,store:STORES[Number(args[1].username.slice(-2))-1]});if(fn==='submitReview')return Promise.resolve({success:true});if(fn==='login'){const id=args[0].username;user={id,role:id==='admin'?'admin':'store',store:id==='admin'?'Tüm mağazalar':'Kavacık'};return Promise.resolve({token:'demo',user});}if(fn==='logout'||fn==='changePassword')return Promise.resolve(true);if(fn==='getDashboard'){const admin=user.role==='admin',month=args[1]?.month||'KASIM 2026',store=args[1]?.store;let rows=Array.from({length:38},(_,i)=>({date:new Date(Date.UTC(2026,month==='EKİM 2026'?9:10,16-i%15,9+i%8,i%60)).toISOString(),name:['Ayşe Yılmaz','Mehmet Demir','Zeynep Kaya','Emre Çelik','Elif Aydın','Can Arslan'][i%6],score:[10,9,8,10,6,9,7,10,4,8][i%10],store:STORES[i%13],comment:['İlgileri için teşekkür ederim, alışverişimden memnun kaldım.','Teslimat süresi hakkında daha net bilgi verilebilir.','','Çalışanlar çok yardımcı oldu.'][i%4],channel:CHANNELS[i%4]})).filter(r=>admin?(!store||r.store===store):r.store===user.store);if(!admin)rows=rows.map(({date,name,score})=>({date,name,score}));return Promise.resolve({user,months:['KASIM 2026','EKİM 2026'],month,reviews:rows,...(admin?{branches:STORES.map((s,i)=>({store:s,lastLogin:i<9?new Date(Date.UTC(2026,10,16-i%4,8+i%8)).toISOString():null})),logs:STORES.slice(0,9).map((s,i)=>({date:new Date(Date.UTC(2026,10,16-i%4,8+i%8)).toISOString(),username:'magaza'+String(i+1).padStart(2,'0'),store:s,event:'Giriş',result:'Başarılı'}))}:{})});}return Promise.reject(Error('Önizlemede desteklenmeyen işlem.'));}
if(demo)document.getElementById('demoBanner').classList.remove('hidden');survey();
</script></body></html>
